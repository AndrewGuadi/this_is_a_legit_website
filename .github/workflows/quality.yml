name: Production readiness
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest -v
      - run: python -m unittest discover -s orchestration -p 'test_*.py' -v
      - run: python -m unittest discover -s tests/runtime -p 'test_*.py' -v
      - run: python -m unittest discover -s tests/operations -p 'test_*.py' -v
      - run: python tests/research/runner.py --output benchmark-evidence/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-evidence
          path: benchmark-evidence/
          retention-days: 7
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: pip install -r requirements.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python orchestration/runtime_smoke.py --output runtime-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolation-evidence
          path: runtime-evidence/
          retention-days: 7
  production-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tests/runtime/production_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-evidence
          path: production-evidence/
          retention-days: 7
